fragment PageParts on Page {
  __typename
  adminLabel
  outerBgColor
  blocks {
    __typename
    ... on PageBlocksHero {
      heading
      subheading
      align
      textColor
      fontSize
      fontWeight
      pt
      pb
      pl
      pr
      mt
      mb
      ml
      mr
    }
    ... on PageBlocksHeading {
      text
      align
      textColor
      fontSize
      fontWeight
      pt
      pb
      pl
      pr
      mt
      mb
      ml
      mr
    }
    ... on PageBlocksContent {
      body
      align
      textColor
      fontSize
      fontWeight
      pt
      pb
      pl
      pr
      mt
      mb
      ml
      mr
    }
    ... on PageBlocksCta {
      title
      link
      align
      btnBgColor
      btnTextColor
      fontSize
      fontWeight
      pt
      pb
      pl
      pr
      mt
      mb
      ml
      mr
    }
    ... on PageBlocksNavbar {
      logoText
      links {
        __typename
        label
        url
      }
    }
    ... on PageBlocksImage {
      url
      caption
      align
      mt
      mb
      pl
      pr
      borderRadius
    }
  }
}
