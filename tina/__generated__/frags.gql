fragment PageParts on Page {
  __typename
  title
  description
  titleAlignment
  outerBgColor
  blocks {
    __typename
    ... on PageBlocksNavbar {
      logoText
      links {
        __typename
        label
        url
      }
    }
    ... on PageBlocksHero {
      heading
      subheading
      align
      textColor
      fontSize
      fontWeight
      italic
      marginTop
      marginBottom
      paddingLeft
      paddingRight
    }
    ... on PageBlocksHeading {
      text
      align
      textColor
      fontSize
      fontWeight
      italic
      marginTop
      marginBottom
      paddingLeft
      paddingRight
    }
    ... on PageBlocksContent {
      body
      align
      textColor
      fontSize
      fontWeight
      italic
      marginTop
      marginBottom
      paddingLeft
      paddingRight
    }
    ... on PageBlocksImage {
      url
      caption
      borderRadius
      marginTop
      marginBottom
    }
    ... on PageBlocksCta {
      title
      link
      btnBgColor
      btnTextColor
      borderRadius
      align
      marginTop
      marginBottom
      paddingLeft
      paddingRight
    }
  }
}
