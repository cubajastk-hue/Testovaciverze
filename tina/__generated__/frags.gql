fragment PageParts on Page {
  __typename
  adminLabel
  outerBgColor
  blocks {
    __typename
    ... on PageBlocksNavbar {
      adminLabel
      logoText
      links {
        __typename
        label
        url
      }
    }
    ... on PageBlocksHero {
      adminLabel
      heading
      subheading
      body
      align
      textColor
      fontSize
      fontWeight
      pt
      pb
    }
    ... on PageBlocksHeading {
      adminLabel
      text
      align
      textColor
      fontSize
      mt
      mb
    }
    ... on PageBlocksContent {
      adminLabel
      body
      align
      textColor
      fontSize
    }
  }
}
