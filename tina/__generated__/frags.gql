fragment PageParts on Page {
  __typename
  title
  description
  titleAlignment
  outerBgColor
  blocks {
    __typename
    ... on PageBlocksNavbar {
      logoText
      links {
        __typename
        label
        url
      }
    }
    ... on PageBlocksHero {
      heading
      subheading
      align
    }
    ... on PageBlocksHeading {
      text
      align
    }
    ... on PageBlocksContent {
      body
      align
    }
    ... on PageBlocksImage {
      url
      caption
      align
    }
    ... on PageBlocksCta {
      title
      link
      align
    }
  }
}
