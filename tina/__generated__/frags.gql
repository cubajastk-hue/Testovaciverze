fragment PageParts on Page {
  __typename
  adminLabel
  outerBgColor
  blocks {
    __typename
    ... on PageBlocksNavbar {
      adminLabel
      logoText
      links {
        __typename
        label
        url
      }
    }
    ... on PageBlocksHero {
      adminLabel
      heading
      subheading
      body
      align
      textColor
      fontSize
      fontWeight
      pt
      pb
      pl
      pr
      mt
      mb
    }
    ... on PageBlocksHeading {
      adminLabel
      text
      align
      textColor
      fontSize
      fontWeight
      mt
      mb
    }
    ... on PageBlocksContent {
      adminLabel
      body
      align
      textColor
      fontSize
      mt
      mb
    }
    ... on PageBlocksCta {
      adminLabel
      title
      link
      align
      btnBgColor
      btnTextColor
    }
    ... on PageBlocksImage {
      adminLabel
      url
      caption
      body
      align
    }
  }
}
